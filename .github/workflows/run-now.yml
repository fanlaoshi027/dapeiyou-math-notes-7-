name: Run preview generation now

on:
  push:
    paths:
      - '.github/workflows/run-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python and Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip fonts-arphic-gkai
          python3 -m pip install --upgrade pillow --break-system-packages
      - name: Generate images
        run: python3 scripts/generate_preview.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "试制前三讲"
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "生成前三讲六张试制图片"
            git push
          fi
